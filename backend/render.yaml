# PDF on Render: @sparticuz/chromium (installed with npm install — no separate Chrome download).
#
# Render Dashboard (if you are NOT using a Blueprint from this file):
#   • Root Directory: `backend`
#   • Build Command:  npm install
#   • Start Command:  npm start
# After deploy: GET /api/contracts/pdf-ready → ok: true, pdfEngine: sparticuz-chromium
services:
  - type: web
    name: build-profit-solutions-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://build-profit-solutions-mobile.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      # AI models — Terra for estimate/vision; Luna for routing and lightweight tasks
      - key: AI_MODEL_ASSISTANT_ESTIMATE
        value: gpt-5.6-terra
      - key: AI_MODEL_ASSISTANT_VISION
        value: gpt-5.6-terra
      - key: AI_MODEL_ASSISTANT_RESPONSE
        value: gpt-5.6-terra
      - key: AI_MODEL_ASSISTANT_ROUTER
        value: gpt-5.6-luna
      - key: AI_MODEL_DASHBOARD_SUMMARY
        value: gpt-5.6-luna
      - key: AI_MODEL_OCR_RECEIPT
        value: gpt-5.6-terra
      - key: AI_MODEL_LEAD_SCORING
        value: gpt-5.6-luna
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRODUCT_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: BETA_FEEDBACK_INTAKE_ENABLED
        sync: false
      - key: BETA_FEEDBACK_ADMIN_KEY
        sync: false
      - key: APP_TELEMETRY_ENABLED
        sync: false
      # Find Subcontractors — Google Places API (New). Same key as Maps; set one of these on the web service.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false