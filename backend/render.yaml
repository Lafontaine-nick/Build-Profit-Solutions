# Option A (PDFs): Chrome installs during **build** into `render-pdf-chrome/` (tracked folder, not gitignored)
# so Render includes it in the deploy slug. Do not commit large binaries under `render-pdf-chrome/`.
#
# Render Dashboard (if you are NOT using a Blueprint from this file):
#   • Root Directory: `backend` (folder that contains package.json + this render.yaml)
#   • Build Command:  npm install && npm run install-chrome:render-build
#   • Start Command:  npm start
# After deploy: GET /api/contracts/pdf-ready should show chromeOnDisk true.
# server.js pins PUPPETEER_CACHE_DIR on Render to backend/render-pdf-chrome/; contracts.js keeps a runtime Chrome install fallback.
services:
  - type: web
    name: build-profit-solutions-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run install-chrome:render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://build-profit-solutions-mobile.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRODUCT_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: BETA_FEEDBACK_INTAKE_ENABLED
        sync: false
      - key: BETA_FEEDBACK_ADMIN_KEY
        sync: false
      - key: APP_TELEMETRY_ENABLED
        sync: false
      # Find Subcontractors — Google Places API (New). Same key as Maps; set one of these on the web service.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false