services:
  - type: web
    name: build-profit-solutions-backend
    env: node
    plan: starter
    # Same cache dir as server.js (NODE_ENV=production → backend/.puppeteer-cache)
    buildCommand: export PUPPETEER_CACHE_DIR=$PWD/.puppeteer-cache && npm install && npx puppeteer browsers install chrome
    # Match build cache dir at runtime (Render home default cache is empty here).
    startCommand: export PUPPETEER_CACHE_DIR="$PWD/.puppeteer-cache" && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://build-profit-solutions-mobile.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRODUCT_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: BETA_FEEDBACK_INTAKE_ENABLED
        sync: false
      - key: BETA_FEEDBACK_ADMIN_KEY
        sync: false
      - key: APP_TELEMETRY_ENABLED
        sync: false
      # Find Subcontractors — Google Places API (New). Set in Render dashboard.
      - key: GOOGLE_PLACES_API_KEY
        sync: false